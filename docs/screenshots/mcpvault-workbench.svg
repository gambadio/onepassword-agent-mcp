<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">1Password Agent MCP vault flow</title>
  <desc id="desc">Example dashboard showing source vault search, a direct MCPVAULT drop card, and compact agent item approvals.</desc>
  <rect width="1280" height="820" fill="#f4f6f8"/>
  <rect width="1280" height="86" fill="#ffffff"/>
  <rect y="85" width="1280" height="1" fill="#d7dee8"/>
  <rect x="18" y="23" width="42" height="42" rx="10" fill="#e7f5f2"/>
  <path d="M39 31l16 8v16l-16 8-16-8V39l16-8z" fill="#147d73"/>
  <path d="M31 43h16M39 35v24" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <text x="72" y="38" fill="#1e2633" font-family="Arial, sans-serif" font-size="22" font-weight="700">1Password Agent MCP</text>
  <text x="72" y="62" fill="#627084" font-family="Arial, sans-serif" font-size="14">1Password CLI 2.34.1 ready. 2/2 entries allowed.</text>
  <rect x="1168" y="25" width="86" height="36" rx="6" fill="#147d73"/>
  <text x="1211" y="48" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="700">Refresh</text>

  <rect x="18" y="106" width="1244" height="150" rx="8" fill="#ffffff" stroke="#d7dee8"/>
  <text x="36" y="138" fill="#1e2633" font-family="Arial, sans-serif" font-size="17" font-weight="700">Agent Vault Setup</text>
  <text x="36" y="160" fill="#627084" font-family="Arial, sans-serif" font-size="13">Agents only use enabled items from MCPVAULT.</text>
  <g transform="translate(36 184)">
    <circle cx="14" cy="14" r="14" fill="#ebf2ff"/>
    <text x="14" y="19" text-anchor="middle" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="14" font-weight="700">1</text>
    <text x="42" y="8" fill="#1e2633" font-family="Arial, sans-serif" font-size="15" font-weight="700">Use a dedicated agent vault</text>
    <text x="42" y="29" fill="#627084" font-family="Arial, sans-serif" font-size="12">MCPVAULT exists and is the only vault agents can use.</text>
  </g>
  <g transform="translate(452 184)">
    <circle cx="14" cy="14" r="14" fill="#ebf2ff"/>
    <text x="14" y="19" text-anchor="middle" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="14" font-weight="700">2</text>
    <text x="42" y="8" fill="#1e2633" font-family="Arial, sans-serif" font-size="15" font-weight="700">Drop items onto that vault</text>
    <text x="42" y="29" fill="#627084" font-family="Arial, sans-serif" font-size="12">The app asks whether to copy or move after the drop.</text>
  </g>
  <g transform="translate(868 184)">
    <circle cx="14" cy="14" r="14" fill="#ebf2ff"/>
    <text x="14" y="19" text-anchor="middle" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="14" font-weight="700">3</text>
    <text x="42" y="8" fill="#1e2633" font-family="Arial, sans-serif" font-size="15" font-weight="700">Approve exact fields</text>
    <text x="42" y="29" fill="#627084" font-family="Arial, sans-serif" font-size="12">Fields resolve locally only during copy or paste.</text>
  </g>

  <rect x="18" y="286" width="600" height="486" rx="8" fill="#ffffff" stroke="#d7dee8"/>
  <text x="36" y="318" fill="#1e2633" font-family="Arial, sans-serif" font-size="17" font-weight="700">Choose From 1Password</text>
  <text x="36" y="340" fill="#627084" font-family="Arial, sans-serif" font-size="13">Find an item in your normal vault. Nothing is shared yet.</text>
  <rect x="36" y="362" width="238" height="96" rx="8" fill="#fbfcfe" stroke="#c8d3df"/>
  <text x="54" y="390" fill="#627084" font-family="Arial, sans-serif" font-size="11" font-weight="700">FROM YOUR VAULT</text>
  <text x="54" y="420" fill="#1e2633" font-family="Arial, sans-serif" font-size="19" font-weight="700">Private</text>
  <text x="54" y="442" fill="#627084" font-family="Arial, sans-serif" font-size="12">Drag one search result.</text>
  <text x="302" y="419" fill="#0f5f58" font-family="Arial, sans-serif" font-size="22" font-weight="700">-&gt;</text>
  <rect x="338" y="362" width="244" height="96" rx="8" fill="#f0faf8" stroke="#147d73"/>
  <circle cx="554" cy="388" r="13" fill="#147d73"/>
  <text x="554" y="393" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="17" font-weight="700">+</text>
  <text x="356" y="390" fill="#627084" font-family="Arial, sans-serif" font-size="11" font-weight="700">DROP HERE</text>
  <text x="356" y="420" fill="#1e2633" font-family="Arial, sans-serif" font-size="19" font-weight="700">MCPVAULT</text>
  <text x="356" y="442" fill="#627084" font-family="Arial, sans-serif" font-size="12">Then choose Copy or Move.</text>
  <rect x="36" y="480" width="150" height="36" rx="6" fill="#fff" stroke="#d7dee8"/>
  <text x="48" y="503" fill="#627084" font-family="Arial, sans-serif" font-size="13">Private</text>
  <rect x="198" y="480" width="190" height="36" rx="6" fill="#fff" stroke="#d7dee8"/>
  <text x="210" y="503" fill="#627084" font-family="Arial, sans-serif" font-size="13">github</text>
  <rect x="400" y="480" width="104" height="36" rx="6" fill="#e9f7f4" stroke="#94bdb8"/>
  <text x="452" y="503" text-anchor="middle" fill="#0f5f58" font-family="Arial, sans-serif" font-size="13" font-weight="700">API keys</text>
  <rect x="516" y="480" width="84" height="36" rx="6" fill="#147d73"/>
  <text x="558" y="503" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="700">Search</text>

  <g transform="translate(36 540)">
    <rect width="564" height="78" rx="8" fill="#f2fbf9" stroke="#94bdb8"/>
    <text x="16" y="25" fill="#1e2633" font-family="Arial, sans-serif" font-size="15" font-weight="700">GitHub Work Login</text>
    <text x="16" y="47" fill="#627084" font-family="Arial, sans-serif" font-size="12">vault: Private | site: github.com | field: password</text>
    <rect x="430" y="21" width="54" height="32" rx="6" fill="#147d73"/>
    <text x="457" y="42" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="12" font-weight="700">Copy</text>
    <rect x="494" y="21" width="54" height="32" rx="6" fill="#fff" stroke="#147d73"/>
    <text x="521" y="42" text-anchor="middle" fill="#147d73" font-family="Arial, sans-serif" font-size="12" font-weight="700">Move</text>
  </g>
  <g transform="translate(36 630)">
    <rect width="564" height="78" rx="8" fill="#fbfcfe" stroke="#d7dee8"/>
    <text x="16" y="25" fill="#1e2633" font-family="Arial, sans-serif" font-size="15" font-weight="700">Stripe Demo Account</text>
    <text x="16" y="47" fill="#627084" font-family="Arial, sans-serif" font-size="12">vault: Private | site: stripe.com | field: password</text>
    <rect x="430" y="21" width="54" height="32" rx="6" fill="#147d73"/>
    <text x="457" y="42" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="12" font-weight="700">Copy</text>
    <rect x="494" y="21" width="54" height="32" rx="6" fill="#fff" stroke="#147d73"/>
    <text x="521" y="42" text-anchor="middle" fill="#147d73" font-family="Arial, sans-serif" font-size="12" font-weight="700">Move</text>
  </g>

  <rect x="640" y="286" width="622" height="486" rx="8" fill="#ffffff" stroke="#d7dee8"/>
  <text x="658" y="318" fill="#1e2633" font-family="Arial, sans-serif" font-size="17" font-weight="700">Approve Agent Items</text>
  <text x="658" y="340" fill="#627084" font-family="Arial, sans-serif" font-size="13">Copied items stay compact until you review them.</text>
  <g transform="translate(658 362)">
    <rect width="90" height="54" rx="8" fill="#e9f7f4" stroke="#147d73"/>
    <text x="14" y="23" fill="#0f5f58" font-family="Arial, sans-serif" font-size="12" font-weight="700">All Fields</text>
    <text x="14" y="42" fill="#627084" font-family="Arial, sans-serif" font-size="12" font-weight="700">5</text>
    <rect x="102" width="94" height="54" rx="8" fill="#fff" stroke="#d7dee8"/>
    <text x="116" y="23" fill="#344054" font-family="Arial, sans-serif" font-size="12" font-weight="700">Logins</text>
    <text x="116" y="42" fill="#627084" font-family="Arial, sans-serif" font-size="12" font-weight="700">2</text>
    <rect x="208" width="104" height="54" rx="8" fill="#fff" stroke="#d7dee8"/>
    <text x="222" y="23" fill="#344054" font-family="Arial, sans-serif" font-size="12" font-weight="700">API Keys</text>
    <text x="222" y="42" fill="#627084" font-family="Arial, sans-serif" font-size="12" font-weight="700">2</text>
    <rect x="324" width="112" height="54" rx="8" fill="#fff" stroke="#d7dee8"/>
    <text x="338" y="23" fill="#344054" font-family="Arial, sans-serif" font-size="12" font-weight="700">Credit Cards</text>
    <text x="338" y="42" fill="#627084" font-family="Arial, sans-serif" font-size="12" font-weight="700">1</text>
  </g>
  <g transform="translate(658 448)">
    <rect width="586" height="86" rx="8" fill="#fbfcfe" stroke="#d7dee8"/>
    <text x="16" y="28" fill="#1e2633" font-family="Arial, sans-serif" font-size="15" font-weight="700">GitHub API Token</text>
    <text x="16" y="50" fill="#627084" font-family="Arial, sans-serif" font-size="12">API item · 1 detail suggested · nothing shared yet</text>
    <rect x="454" y="25" width="112" height="36" rx="6" fill="#ffffff" stroke="#147d73"/>
    <text x="510" y="48" text-anchor="middle" fill="#147d73" font-family="Arial, sans-serif" font-size="13" font-weight="700">Review Details</text>
  </g>
  <g transform="translate(658 552)">
    <rect width="586" height="116" rx="8" fill="#fbfcfe" stroke="#d7dee8"/>
    <text x="16" y="27" fill="#1e2633" font-family="Arial, sans-serif" font-size="15" font-weight="700">Revolut Card</text>
    <text x="16" y="49" fill="#627084" font-family="Arial, sans-serif" font-size="12">Card item · 4 details found · CVV not selected by default</text>
    <rect x="16" y="66" width="438" height="34" rx="6" fill="#fff" stroke="#d7dee8"/>
    <text x="28" y="88" fill="#627084" font-family="Arial, sans-serif" font-size="13">blank means all websites</text>
    <rect x="470" y="66" width="96" height="34" rx="6" fill="#147d73"/>
    <text x="518" y="88" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="700">Approve</text>
  </g>
</svg>
