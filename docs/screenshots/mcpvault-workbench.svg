<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">1Password Agent MCP vault workbench</title>
  <desc id="desc">Example dashboard showing a dedicated MCPVAULT, source vault search, drag and drop targets, and agent item approvals.</desc>
  <rect width="1280" height="820" fill="#f4f6f8"/>
  <rect width="1280" height="86" fill="#ffffff"/>
  <rect y="85" width="1280" height="1" fill="#d7dee8"/>
  <rect x="18" y="23" width="42" height="42" rx="10" fill="#e7f5f2"/>
  <path d="M39 31l16 8v16l-16 8-16-8V39l16-8z" fill="#147d73"/>
  <path d="M31 43h16M39 35v24" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <text x="72" y="38" fill="#1e2633" font-family="Arial, sans-serif" font-size="22" font-weight="700">1Password Agent MCP</text>
  <text x="72" y="62" fill="#627084" font-family="Arial, sans-serif" font-size="14">1Password CLI 2.34.1 ready. 2/2 entries allowed.</text>
  <rect x="1168" y="25" width="86" height="36" rx="6" fill="#147d73"/>
  <text x="1211" y="48" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="700">Refresh</text>

  <rect x="18" y="106" width="1244" height="150" rx="8" fill="#ffffff" stroke="#d7dee8"/>
  <text x="36" y="138" fill="#1e2633" font-family="Arial, sans-serif" font-size="17" font-weight="700">Agent Vault Setup</text>
  <text x="36" y="160" fill="#627084" font-family="Arial, sans-serif" font-size="13">Agents only use enabled items from MCPVAULT.</text>
  <g transform="translate(36 184)">
    <circle cx="14" cy="14" r="14" fill="#ebf2ff"/>
    <text x="14" y="19" text-anchor="middle" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="14" font-weight="700">1</text>
    <text x="42" y="8" fill="#1e2633" font-family="Arial, sans-serif" font-size="15" font-weight="700">Use a dedicated agent vault</text>
    <text x="42" y="29" fill="#627084" font-family="Arial, sans-serif" font-size="12">MCPVAULT exists and is the only vault agents can use.</text>
  </g>
  <g transform="translate(452 184)">
    <circle cx="14" cy="14" r="14" fill="#ebf2ff"/>
    <text x="14" y="19" text-anchor="middle" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="14" font-weight="700">2</text>
    <text x="42" y="8" fill="#1e2633" font-family="Arial, sans-serif" font-size="15" font-weight="700">Copy logins into that vault</text>
    <text x="42" y="29" fill="#627084" font-family="Arial, sans-serif" font-size="12">Copy keeps the original item in place.</text>
  </g>
  <g transform="translate(868 184)">
    <circle cx="14" cy="14" r="14" fill="#ebf2ff"/>
    <text x="14" y="19" text-anchor="middle" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="14" font-weight="700">3</text>
    <text x="42" y="8" fill="#1e2633" font-family="Arial, sans-serif" font-size="15" font-weight="700">Approve sites for agents</text>
    <text x="42" y="29" fill="#627084" font-family="Arial, sans-serif" font-size="12">Passwords resolve locally only during copy or paste.</text>
  </g>

  <rect x="18" y="274" width="1244" height="126" rx="8" fill="#ffffff" stroke="#d7dee8"/>
  <text x="36" y="306" fill="#1e2633" font-family="Arial, sans-serif" font-size="17" font-weight="700">Vault Workbench</text>
  <text x="36" y="328" fill="#627084" font-family="Arial, sans-serif" font-size="13">Drag a login from the source vault into the agent vault.</text>
  <rect x="36" y="346" width="590" height="36" rx="8" fill="#f0faf8" stroke="#147d73"/>
  <text x="331" y="369" text-anchor="middle" fill="#0f5f58" font-family="Arial, sans-serif" font-size="14" font-weight="700">Copy Into MCPVAULT</text>
  <rect x="654" y="346" width="590" height="36" rx="8" fill="#ffffff" stroke="#aab7c7" stroke-dasharray="6 5"/>
  <text x="949" y="369" text-anchor="middle" fill="#1e2633" font-family="Arial, sans-serif" font-size="14" font-weight="700">Move Into MCPVAULT</text>

  <rect x="18" y="418" width="600" height="354" rx="8" fill="#ffffff" stroke="#d7dee8"/>
  <text x="36" y="450" fill="#1e2633" font-family="Arial, sans-serif" font-size="17" font-weight="700">Choose From 1Password</text>
  <rect x="36" y="470" width="176" height="36" rx="6" fill="#fff" stroke="#d7dee8"/>
  <text x="48" y="493" fill="#627084" font-family="Arial, sans-serif" font-size="13">Private</text>
  <rect x="224" y="470" width="280" height="36" rx="6" fill="#fff" stroke="#d7dee8"/>
  <text x="236" y="493" fill="#627084" font-family="Arial, sans-serif" font-size="13">github</text>
  <rect x="516" y="470" width="84" height="36" rx="6" fill="#147d73"/>
  <text x="558" y="493" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="700">Search</text>

  <g transform="translate(36 528)">
    <rect width="564" height="78" rx="8" fill="#fbfcfe" stroke="#94bdb8"/>
    <text x="16" y="25" fill="#1e2633" font-family="Arial, sans-serif" font-size="15" font-weight="700">GitHub Work Login</text>
    <text x="16" y="47" fill="#627084" font-family="Arial, sans-serif" font-size="12">vault: Private | site: github.com | field: password</text>
    <rect x="430" y="21" width="54" height="32" rx="6" fill="#147d73"/>
    <text x="457" y="42" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="12" font-weight="700">Copy</text>
    <rect x="494" y="21" width="54" height="32" rx="6" fill="#fff" stroke="#147d73"/>
    <text x="521" y="42" text-anchor="middle" fill="#147d73" font-family="Arial, sans-serif" font-size="12" font-weight="700">Move</text>
  </g>
  <g transform="translate(36 618)">
    <rect width="564" height="78" rx="8" fill="#fbfcfe" stroke="#d7dee8"/>
    <text x="16" y="25" fill="#1e2633" font-family="Arial, sans-serif" font-size="15" font-weight="700">Stripe Demo Account</text>
    <text x="16" y="47" fill="#627084" font-family="Arial, sans-serif" font-size="12">vault: Private | site: stripe.com | field: password</text>
    <rect x="430" y="21" width="54" height="32" rx="6" fill="#147d73"/>
    <text x="457" y="42" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="12" font-weight="700">Copy</text>
    <rect x="494" y="21" width="54" height="32" rx="6" fill="#fff" stroke="#147d73"/>
    <text x="521" y="42" text-anchor="middle" fill="#147d73" font-family="Arial, sans-serif" font-size="12" font-weight="700">Move</text>
  </g>

  <rect x="640" y="418" width="622" height="354" rx="8" fill="#ffffff" stroke="#d7dee8"/>
  <text x="658" y="450" fill="#1e2633" font-family="Arial, sans-serif" font-size="17" font-weight="700">Approve Agent Items</text>
  <rect x="658" y="470" width="412" height="36" rx="6" fill="#fff" stroke="#d7dee8"/>
  <text x="670" y="493" fill="#627084" font-family="Arial, sans-serif" font-size="13">github.com</text>
  <rect x="1084" y="470" width="84" height="36" rx="6" fill="#147d73"/>
  <text x="1126" y="493" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="700">Refresh</text>
  <g transform="translate(658 528)">
    <rect width="586" height="116" rx="8" fill="#fbfcfe" stroke="#d7dee8"/>
    <text x="16" y="25" fill="#1e2633" font-family="Arial, sans-serif" font-size="15" font-weight="700">GitHub Work Login</text>
    <text x="16" y="47" fill="#627084" font-family="Arial, sans-serif" font-size="12">vault: MCPVAULT | site: github.com | field: password</text>
    <rect x="16" y="64" width="438" height="34" rx="6" fill="#fff" stroke="#d7dee8"/>
    <text x="28" y="86" fill="#627084" font-family="Arial, sans-serif" font-size="13">github.com, *.github.com</text>
    <rect x="470" y="64" width="96" height="34" rx="6" fill="#147d73"/>
    <text x="518" y="86" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="700">Approve</text>
  </g>
</svg>
