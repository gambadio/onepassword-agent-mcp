<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">Drop an item onto MCPVAULT</title>
  <desc id="desc">Example showing a source item being dragged directly onto the MCPVAULT card, followed by a Copy or Move choice.</desc>
  <rect width="1120" height="560" fill="#f4f6f8"/>
  <rect x="32" y="32" width="1056" height="496" rx="10" fill="#ffffff" stroke="#d7dee8"/>
  <text x="56" y="70" fill="#1e2633" font-family="Arial, sans-serif" font-size="22" font-weight="700">Move items by dropping them on the vault</text>
  <text x="56" y="96" fill="#627084" font-family="Arial, sans-serif" font-size="14">Drag from a normal vault. Drop on MCPVAULT. Then choose Copy or Move.</text>

  <rect x="56" y="136" width="438" height="336" rx="8" fill="#fbfcfe" stroke="#d7dee8"/>
  <text x="78" y="170" fill="#1e2633" font-family="Arial, sans-serif" font-size="17" font-weight="700">Source Vault: Private</text>
  <g transform="translate(78 202)">
    <rect width="394" height="82" rx="8" fill="#ffffff" stroke="#94bdb8"/>
    <text x="18" y="29" fill="#1e2633" font-family="Arial, sans-serif" font-size="16" font-weight="700">GitHub Work Login</text>
    <text x="18" y="53" fill="#627084" font-family="Arial, sans-serif" font-size="12">site: github.com | field: password</text>
  </g>
  <g transform="translate(96 320)">
    <rect width="394" height="82" rx="8" fill="#ffffff" stroke="#d7dee8"/>
    <text x="18" y="29" fill="#1e2633" font-family="Arial, sans-serif" font-size="16" font-weight="700">Stripe Demo Account</text>
    <text x="18" y="53" fill="#627084" font-family="Arial, sans-serif" font-size="12">site: stripe.com | field: password</text>
  </g>

  <path d="M502 242 C604 182 675 178 761 236" fill="none" stroke="#147d73" stroke-width="4" stroke-linecap="round"/>
  <path d="M759 237 l-21 -3 l12 18 z" fill="#147d73"/>
  <rect x="555" y="174" width="210" height="68" rx="8" fill="#f2fbf9" stroke="#147d73"/>
  <text x="660" y="203" text-anchor="middle" fill="#0f5f58" font-family="Arial, sans-serif" font-size="14" font-weight="700">dragging...</text>
  <text x="660" y="224" text-anchor="middle" fill="#627084" font-family="Arial, sans-serif" font-size="12">encrypted local handle only</text>

  <rect x="626" y="136" width="438" height="336" rx="8" fill="#fbfcfe" stroke="#d7dee8"/>
  <text x="648" y="170" fill="#1e2633" font-family="Arial, sans-serif" font-size="17" font-weight="700">Agent Vault</text>
  <rect x="648" y="202" width="394" height="116" rx="8" fill="#f0faf8" stroke="#147d73" stroke-width="2"/>
  <circle cx="1014" cy="230" r="13" fill="#147d73"/>
  <text x="1014" y="235" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="17" font-weight="700">+</text>
  <text x="674" y="233" fill="#627084" font-family="Arial, sans-serif" font-size="11" font-weight="700">DROP HERE</text>
  <text x="674" y="264" fill="#0f5f58" font-family="Arial, sans-serif" font-size="22" font-weight="700">MCPVAULT</text>
  <text x="674" y="290" fill="#627084" font-family="Arial, sans-serif" font-size="13">The app asks what to do next.</text>

  <rect x="700" y="346" width="292" height="96" rx="8" fill="#ffffff" stroke="#d7dee8"/>
  <text x="722" y="376" fill="#1e2633" font-family="Arial, sans-serif" font-size="17" font-weight="700">Put this item in MCPVAULT?</text>
  <text x="722" y="399" fill="#627084" font-family="Arial, sans-serif" font-size="12">Copy keeps it in Private. Move removes it from Private.</text>
  <rect x="722" y="416" width="66" height="32" rx="6" fill="#147d73"/>
  <text x="755" y="437" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="12" font-weight="700">Copy</text>
  <rect x="798" y="416" width="66" height="32" rx="6" fill="#fff" stroke="#b42318"/>
  <text x="831" y="437" text-anchor="middle" fill="#b42318" font-family="Arial, sans-serif" font-size="12" font-weight="700">Move</text>
  <rect x="874" y="416" width="74" height="32" rx="6" fill="#fff" stroke="#147d73"/>
  <text x="911" y="437" text-anchor="middle" fill="#147d73" font-family="Arial, sans-serif" font-size="12" font-weight="700">Cancel</text>
</svg>
